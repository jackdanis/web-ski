<!doctype html><meta charset="utf-8"><body style="margin:0;background:transparent">
<script src="../vendor/three.min.js"></script><script src="../vendor/GLTFLoader.js"></script><script src="../vendor/GLTFExporter.js"></script>
<script>
// Render a GLB as sprite passes: albedo (unlit colour) and a view-space normal map (OpenGL: +x right, +y up, +z to camera).
window.renderPasses = async function (glbUrl, opts) {
  const { size = 1024, yaws = [0], pitch = 10, margin = 0.04 } = opts || {};
  const gltf = await new Promise((res, rej) => new THREE.GLTFLoader().load(glbUrl, res, undefined, rej));
  const root = gltf.scene;
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  root.position.set(-c.x, -box.min.y, -c.z);
  const holder = new THREE.Group(); holder.add(root);
  const scene = new THREE.Scene(); scene.add(holder);
  const r = Math.max(sz.x, sz.z) / 2, h = sz.y;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false, preserveDrawingBuffer: true }); renderer.outputEncoding = THREE.sRGBEncoding; // glTF colour textures are sRGB; write them back out unchanged
  const meshes = []; root.traverse(o => { if (o.isMesh) meshes.push(o); });
  const albedo = meshes.map(m => { const s = m.material; return new THREE.MeshBasicMaterial({ map: s.map || null, color: s.color ? s.color.clone() : 0xffffff, vertexColors: !!m.geometry.attributes.color, side: THREE.DoubleSide, alphaTest: s.alphaTest > 0 ? s.alphaTest : 0, transparent: false }); });
  // glTF OPAQUE materials ignore texture alpha (TRELLIS.2 bakes partial alpha into its textures)
  albedo.forEach((a, i) => { const s = meshes[i].material; if (!(s.alphaTest > 0) && !s.transparent) a.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );', 'gl_FragColor = vec4( outgoingLight, 1.0 );'); }; });
  const normal = meshes.map(m => new THREE.ShaderMaterial({
    side: THREE.DoubleSide, uniforms: { map: { value: m.material.map || null }, useMap: { value: m.material.map && m.material.alphaTest > 0 ? 1 : 0 } },
    vertexShader: "varying vec3 vN; varying vec2 vUv; void main(){ vUv = uv; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform sampler2D map; uniform int useMap; varying vec3 vN; varying vec2 vUv; void main(){ if (useMap == 1 && texture2D(map, vUv).a < 0.5) discard; vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n; gl_FragColor = vec4(n * 0.5 + 0.5, 1.0); }",
  }));
  for (const m of meshes) if (!m.geometry.attributes.normal) m.geometry.computeVertexNormals();
  const out = [];
  for (const yaw of yaws) {
    holder.rotation.y = yaw * Math.PI / 180;
    const p = pitch * Math.PI / 180;
    // fit: projected height of the box when tilted by the pitch
    const viewH = h * Math.cos(p) + 2 * r * Math.sin(p), viewW = 2 * r;
    const H = viewH * (1 + margin * 2), W = Math.max(viewW * (1 + margin * 2), H * 0.1);
    const px = Math.round(size * W / H);
    renderer.setSize(px, size, false);
    const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 0.01, 100);
    const d = 20, cy = h / 2;
    cam.position.set(0, cy + Math.sin(p) * d, Math.cos(p) * d); cam.lookAt(0, cy, 0);
    const shot = mats => { meshes.forEach((m, i) => m.material = mats[i]); renderer.setClearColor(0x000000, 0); renderer.render(scene, cam); return renderer.domElement.toDataURL("image/png"); };
    out.push({ yaw, albedo: shot(albedo), normal: shot(normal) });
  }
  return out;
};
// test helper: export a procedural low-poly snowy spruce as GLB
window.makeTestTree = async function () {
  const g = new THREE.Group();
  const green = new THREE.Color(0x1f4a35), snow = new THREE.Color(0xeef3fa), bark = new THREE.Color(0x4a3426);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 2, 6).translate(0, 1, 0), new THREE.MeshStandardMaterial({ color: bark })); g.add(trunk);
  for (let i = 0; i < 5; i++) {
    const rad = 2.6 - i * 0.45, y = 1.5 + i * 1.6;
    const geo = new THREE.ConeGeometry(rad, 2.6, 9, 2).toNonIndexed().translate(0, y + 1.3, 0);
    const p = geo.attributes.position, col = new Float32Array(p.count * 3), a = new THREE.Vector3(), b = new THREE.Vector3(), e = new THREE.Vector3();
    for (let k = 0; k < p.count; k++) p.setX(k, p.getX(k) * (0.85 + 0.3 * Math.abs(Math.sin(k * 12.9898 + i))));
    for (let k = 0; k < p.count; k += 3) {
      a.fromBufferAttribute(p, k); b.fromBufferAttribute(p, k + 1); e.fromBufferAttribute(p, k + 2);
      const top = Math.max(a.y, b.y, e.y) > y + 1.9 || (k / 3) % 4 === 0;
      for (let j = 0; j < 3; j++) (top ? snow : green).toArray(col, (k + j) * 3);
    }
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true })));
  }
  return await new Promise(res => new THREE.GLTFExporter().parse(g, buf => {
    const bytes = new Uint8Array(buf); let s = ""; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    res(btoa(s));
  }, { binary: true }));
};
</script>
